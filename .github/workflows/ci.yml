name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # the desktop shell is not under test and its binary is ~100 MB per OS
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the floor in package.json engines, and current
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
      # packs the tarball, installs it into a clean project, drives it through
      # an MCP client (including a render through the runner's Chrome), and
      # probes `sketchdex app`
      - run: node test/e2e.mjs

  core:
    name: core / node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - run: npm run test:core
